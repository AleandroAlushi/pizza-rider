<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pizza Rider">
<title>Pizza Rider</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">

<style>
:root{--bg:#0d0d0f;--panel:#17171b;--panel2:#202026;--text:#f7f7f8;--muted:#9b9ba5;--accent:#ff5a36;--border:#2c2c33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100vh}
.top{position:sticky;top:0;z-index:5;background:rgba(13,13,15,.94);backdrop-filter:blur(16px);padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #222}
.topin{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}.appicon{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#ff5a36,#ff8b38);display:grid;place-items:center;font-size:23px}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}
.install{width:auto;padding:9px 11px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:#fff;font-weight:800}
.app{max-width:760px;margin:auto;padding:14px 12px calc(90px + env(safe-area-inset-bottom))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat,.card,.delivery{background:var(--panel);border:1px solid var(--border);border-radius:16px}
.stat{padding:11px}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:var(--muted)}
.card{padding:14px;margin-bottom:14px}.card h2{font-size:16px;margin:0 0 12px}
.field{margin-bottom:11px}label{display:block;font-size:11px;font-weight:800;color:#c9c9cf;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
input,select,button{width:100%;min-height:47px;border-radius:13px;border:1px solid var(--border);background:var(--panel2);color:#fff;padding:12px 13px;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{font-size:14px;font-weight:900}.seg .active{background:var(--accent);border-color:var(--accent)}
.hidden{display:none}.primary{background:linear-gradient(135deg,#ff5a36,#ff7b31);border:none;font-weight:900}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}.toolbar button{width:52px;padding:0;font-size:12px;font-weight:800}
.deliveries{display:grid;gap:9px}.delivery{padding:13px;display:grid;grid-template-columns:1fr auto;gap:10px}
.address{font-weight:900}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px;background:#292930}.je{background:#f05a37}.paid{color:#7bf1ae;background:#173525}.pay{color:#ffe08a;background:#3a321e}.tip{color:#7bf1ae;font-size:13px;font-weight:900;margin-top:8px}.time{font-size:10px;color:var(--muted);margin-top:5px}
.actions{display:flex;gap:6px}.iconBtn{width:40px;height:40px;min-height:40px;padding:0}.empty{padding:30px 12px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:17px}
.sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}.sheetWrap.show{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#1b1b20;border-radius:24px 24px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom))}.grab{width:44px;height:5px;background:#555;border-radius:999px;margin:0 auto 16px}.sheet h3{margin:0 0 8px}.sheet p,.sheet ol{font-size:14px;line-height:1.5;color:#ccc}.close{background:#2b2b31;font-weight:800}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.install{font-size:12px}}
</style>
</head>
<body>
<div class="top">
  <div class="topin">
    <div class="brand"><div class="appicon">🍕</div><div><h1>Pizza Rider</h1><div class="sub">Consegne rapide</div></div></div>
    <button class="install" onclick="openInstall()">Home</button>
  </div>
</div>

<main class="app">
  <section class="stats">
    <div class="stat"><b id="sTotal">0</b><span>Consegne</span></div>
    <div class="stat"><b id="sJe">0</b><span>Just Eat</span></div>
    <div class="stat"><b id="sNorm">0</b><span>Normali</span></div>
    <div class="stat"><b id="sTips">€0,00</b><span>Mance</span></div>
  </section>

  <section class="card">
    <h2 id="formTitle">Nuova consegna</h2>
    <div class="field"><label>Indirizzo</label><input id="address" autocomplete="street-address" placeholder="Via / civico"></div>
    <div class="field"><label>Tipo ordine</label><div class="seg"><button id="btnJE" class="active" onclick="setOrderType('justeat')">Just Eat</button><button id="btnNormal" onclick="setOrderType('normale')">Normale</button></div></div>
    <div id="jeFields" class="field"><label>Pagamento Just Eat</label><select id="jeStatus" onchange="syncPaymentFields()"><option value="pagato">Già pagato</option><option value="dapagare">Da pagare alla consegna</option></select></div>
    <div id="paymentField" class="field hidden"><label>Metodo pagamento</label><select id="paymentMethod"><option value="cash">Cash</option><option value="pos">POS</option><option value="satispay">Satispay</option></select></div>
    <div class="field"><label>Mancia (€)</label><input id="tip" type="number" min="0" step="0.50" inputmode="decimal" placeholder="0,00"></div>
    <button class="primary" id="saveBtn" onclick="saveDelivery()">Aggiungi consegna</button>
  </section>

  <div class="toolbar"><input id="search" placeholder="Cerca indirizzo…" oninput="render()"><button onclick="exportCSV()">CSV</button></div>
  <div id="deliveries" class="deliveries"></div>
</main>

<div id="installSheet" class="sheetWrap" onclick="if(event.target===this)closeInstall()">
  <div class="sheet">
    <div class="grab"></div>
    <h3>Aggiungila alla schermata Home</h3>
    <p>Quando la pagina è aperta in Safari:</p>
    <ol><li>Tocca <b>Condividi</b>.</li><li>Scegli <b>Aggiungi alla schermata Home</b>.</li><li>Conferma con <b>Aggiungi</b>.</li></ol>
    <button class="close" onclick="closeInstall()">Chiudi</button>
  </div>
</div>

<script>
const K='pizzaRiderDeliveries_v2';
let deliveries=JSON.parse(localStorage.getItem(K)||localStorage.getItem('pizzaRiderDeliveries_v1')||'[]');
let orderType='justeat',editingId=null;
const $=x=>document.getElementById(x);
const euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n||0));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function openInstall(){$('installSheet').classList.add('show')} function closeInstall(){$('installSheet').classList.remove('show')}
function setOrderType(t){orderType=t;$('btnJE').classList.toggle('active',t==='justeat');$('btnNormal').classList.toggle('active',t==='normale');$('jeFields').classList.toggle('hidden',t!=='justeat');syncPaymentFields()}
function syncPaymentFields(){const show=orderType==='normale'||(orderType==='justeat'&&$('jeStatus').value==='dapagare');$('paymentField').classList.toggle('hidden',!show)}
function persist(){localStorage.setItem(K,JSON.stringify(deliveries))}
function saveDelivery(){
 const address=$('address').value.trim(),tip=Math.max(0,Number($('tip').value||0)); if(!address){alert('Inserisci un indirizzo.');return}
 const jeStatus=orderType==='justeat'?$('jeStatus').value:null; const needs=orderType==='normale'||jeStatus==='dapagare'; const paymentMethod=needs?$('paymentMethod').value:null;
 const old=deliveries.find(d=>d.id===editingId); const item={id:editingId||String(Date.now()),address,orderType,jeStatus,paymentMethod,tip,createdAt:editingId?(old?.createdAt||new Date().toISOString()):new Date().toISOString()};
 deliveries=editingId?deliveries.map(d=>d.id===editingId?item:d):[item,...deliveries]; persist(); resetForm(); render();
}
function editDelivery(id){const d=deliveries.find(x=>x.id===id);if(!d)return;editingId=id;$('formTitle').textContent='Modifica consegna';$('saveBtn').textContent='Salva modifiche';$('address').value=d.address;$('tip').value=d.tip||'';setOrderType(d.orderType);if(d.orderType==='justeat'){$('jeStatus').value=d.jeStatus||'pagato';syncPaymentFields()}if(d.paymentMethod)$('paymentMethod').value=d.paymentMethod;window.scrollTo({top:0,behavior:'smooth'})}
function deleteDelivery(id){if(!confirm('Eliminare questa consegna?'))return;deliveries=deliveries.filter(d=>d.id!==id);persist();render()}
function resetForm(){editingId=null;$('formTitle').textContent='Nuova consegna';$('saveBtn').textContent='Aggiungi consegna';$('address').value='';$('tip').value='';$('jeStatus').value='pagato';$('paymentMethod').value='cash';setOrderType('justeat')}
function payLabel(d){if(d.orderType==='justeat'&&d.jeStatus==='pagato')return['Già pagato','paid'];return[{cash:'Cash',pos:'POS',satispay:'Satispay'}[d.paymentMethod]||'Da pagare','pay']}
function render(){
 $('sTotal').textContent=deliveries.length;$('sJe').textContent=deliveries.filter(d=>d.orderType==='justeat').length;$('sNorm').textContent=deliveries.filter(d=>d.orderType==='normale').length;$('sTips').textContent=euro(deliveries.reduce((s,d)=>s+Number(d.tip||0),0));
 const q=$('search').value.trim().toLowerCase(),f=deliveries.filter(d=>d.address.toLowerCase().includes(q)); if(!f.length){$('deliveries').innerHTML='<div class="empty">Nessuna consegna registrata.</div>';return}
 $('deliveries').innerHTML=f.map(d=>{const [p,c]=payLabel(d),when=new Date(d.createdAt).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});return `<article class="delivery"><div><div class="address">${esc(d.address)}</div><div class="meta"><span class="badge ${d.orderType==='justeat'?'je':''}">${d.orderType==='justeat'?'Just Eat':'Normale'}</span><span class="badge ${c}">${p}</span></div>${Number(d.tip)>0?`<div class="tip">Mancia: ${euro(d.tip)}</div>`:''}<div class="time">${when}</div></div><div class="actions"><button class="iconBtn" onclick="editDelivery('${d.id}')">✏️</button><button class="iconBtn" onclick="deleteDelivery('${d.id}')">🗑️</button></div></article>`}).join('');
}
function exportCSV(){if(!deliveries.length){alert('Non ci sono consegne da esportare.');return}const rows=[['Data','Indirizzo','Tipo ordine','Stato Just Eat','Pagamento','Mancia'],...deliveries.map(d=>[new Date(d.createdAt).toLocaleString('it-IT'),d.address,d.orderType==='justeat'?'Just Eat':'Normale',d.orderType==='justeat'?(d.jeStatus==='pagato'?'Già pagato':'Da pagare'):'',d.paymentMethod||'',Number(d.tip||0).toFixed(2)])];const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(';')).join('\n');const b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='consegne_pizza.csv';a.click()}
syncPaymentFields();render();
</script>
</body>
</html>
